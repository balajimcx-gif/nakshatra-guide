<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Screen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            font-family: sans-serif;
        }
        .screen-content {
            text-align: center;
            max-width: 90%;
            max-height: 90vh;
        }
        img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="screen-content">
        <!-- Change "your-image-name.jpg" to match your exact file name -->
        <img src="upgrade.png" alt="My Displayed Image">
    </div>

</body>
</html>
